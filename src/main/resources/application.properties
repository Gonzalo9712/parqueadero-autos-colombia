spring.application.name=parqueadero

# ====== SQL SERVER (CHALO\SQLEXPRESS) con autenticación de Windows ======
spring.datasource.url=jdbc:sqlserver://localhost;instanceName=SQLEXPRESS;databaseName=autos_colombia;integratedSecurity=true;encrypt=true;trustServerCertificate=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.thymeleaf.cache=false
server.port=8080