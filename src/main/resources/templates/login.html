<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión - Autos Colombia</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="login-box card">
    <h1>🚗 Autos Colombia</h1>
    <p class="small">Sistema de gestión de parqueadero</p>
    <div class="alert error" th:if="${param.error}">Usuario o contraseña incorrectos.</div>
    <div class="alert ok" th:if="${param.logout}">Sesión cerrada correctamente.</div>
    <form th:action="@{/login}" method="post">
        <label for="username">Usuario</label>
        <input id="username" name="username" type="text" required autofocus>
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" required>
        <button type="submit" style="width:100%">Ingresar</button>
    </form>
</div>
</body>
</html>
